[files]
# The Vite bundle is minified, so its mangled identifiers read as thousands of
# typos. It is checked by building it, not by spelling.
extend-exclude = ["assets/settings.html", "*.lock", "ui/pnpm-lock.yaml"]

[default.extend-words]
ANE = "ANE"    # Apple Neural Engine
ane = "ane"
nd = "nd"      # a local in the linkage update in src/diarize.rs
