[files]
# The Vite bundle is minified, so its mangled identifiers read as thousands of
# typos. It is checked by building it, not by spelling.
extend-exclude = [
  "assets/settings.html",
  "*.lock",
  "ui/pnpm-lock.yaml",
  # Moved here from docs/ when the site became Nimbus; mermaid-init.js is
  # hand-written but sits beside the bundle it drives.
  "docs-site/public/mermaid.min.js",
  "docs-site/public/mermaid-init.js",
]

[default.extend-words]
ANE = "ANE"    # Apple Neural Engine
ane = "ane"
nd = "nd"      # a local in the linkage update in src/diarize.rs
