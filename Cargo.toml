[package]
name = "ambient"
version = "0.0.2"
edition = "2021"
rust-version = "1.85"
description = "Local-first ambient capture: room and call audio, transcribed and attributed on-device"
license = "MIT"

[dependencies]
anyhow = "1"
block2 = "0.6.2"
chrono = "0.4"
hound = "3.5.1"
libc = "0.2.189"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3.2"
objc2-web-kit = "0.3"
ort = { version = "=2.0.0-rc.13", features = ["coreml"] }
rubato = "5"
rustfft = "6.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"
objc2-foundation = "0.3"

[profile.release]
lto = "thin"
