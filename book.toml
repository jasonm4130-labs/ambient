[book]
title = "ambient"
description = "Local-first ambient capture for macOS"
src = "docs"
language = "en"

[build]
build-dir = "book"
# A SUMMARY entry pointing at a file that does not exist is a broken nav link,
# not a page to scaffold. Fail the build instead of writing an empty chapter.
create-missing = false

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
git-repository-url = "https://github.com/jasonm4130-labs/ambient"
additional-js = ["docs/mermaid.min.js", "docs/mermaid-init.js"]
