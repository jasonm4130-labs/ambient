# Actions are pinned to commit SHAs; Dependabot proposes reviewed updates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
  # The docs workflow's Mermaid parse check. Pinned exactly, so it needs the
  # same nudging as everything else here.
  - package-ecosystem: npm
    directory: /.github/scripts
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: weekly
