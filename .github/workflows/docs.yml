name: docs

# Its own workflow rather than a job in ci.yml: `paths:` filters are
# per-workflow, so this is the only way to keep docs commits off the
# macOS runner at $0.062/min.
on:
  push:
    branches: [main]
    paths: ['docs/**', 'book.toml', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'book.toml', '.github/workflows/docs.yml']

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  MDBOOK_VERSION: v0.5.4
  MDBOOK_MERMAID_VERSION: v0.17.1

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7.0.1

      # Two pinned binaries and a curl. The whole reason for choosing mdBook
      # over a JS generator is that this step is the entire toolchain — no
      # setup-node, no lockfile, no fourth Dependabot ecosystem.
      - name: Install mdBook and mdbook-mermaid
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          curl -fsSL "https://github.com/badboy/mdbook-mermaid/releases/download/${MDBOOK_MERMAID_VERSION}/mdbook-mermaid-${MDBOOK_MERMAID_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Verified: a broken include exits 0, logs ERROR, and ships the literal
      # directive into the HTML. Neither half of that is caught by the exit
      # code, so both halves are checked below.
      - name: Build
        run: |
          set -euo pipefail
          mdbook build 2>&1 | tee build.log

      - name: Fail on a build error mdBook did not exit on
        run: |
          if grep -q '^ERROR' build.log; then
            grep '^ERROR' build.log
            echo "::error::mdbook logged an error but exited 0"
            exit 1
          fi

      # Deliberately narrower than '{{#': the page documenting this guard
      # necessarily mentions the directive. A real unexpanded one is always
      # a word followed by an argument.
      - name: Fail on unexpanded directives
        run: |
          if grep -rEq '\{\{#[a-z_]+ ' book/ --include='*.html'; then
            grep -rEn '\{\{#[a-z_]+ ' book/ --include='*.html' | head -20
            echo "::error::unexpanded mdBook directive in build output"
            exit 1
          fi

      # mdbook-mermaid only wraps a fence; it never parses the diagram, so a
      # syntax error builds cleanly and renders as an error box on the page.
      # This is the only check here that needs node.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .github/scripts/package-lock.json
      - run: npm ci
        working-directory: .github/scripts
      - run: node .github/scripts/check-mermaid.mjs

      # A record absent from SUMMARY.md is invisible on the site even though the
      # file is in the repo.
      - name: Every ADR is in the nav
        run: |
          set -euo pipefail
          shopt -s nullglob
          records=(docs/adr/[0-9]*.md)
          # Without nullglob an unmatched glob expands to the literal, and
          # `grep -q "[0-9]*.md"` then matches "index.md" as a regex — so the
          # guard passed on an empty directory. Assert the count, and match the
          # filename as a fixed string rather than a pattern.
          if [ "${#records[@]}" -lt 12 ]; then
            echo "::error::found ${#records[@]} ADRs under docs/adr/, expected at least 12 — did the directory move?"
            exit 1
          fi
          for f in "${records[@]}"; do
            grep -qF "$(basename "$f")" docs/SUMMARY.md \
              || { echo "::error::$f missing from docs/SUMMARY.md"; exit 1; }
          done

      # Nothing is deployed yet: workers.dev URLs are public by default and this
      # repo is private, so Cloudflare Access has to be attached first.
      # See docs/developing/docs.md.
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: book
          path: book/
          retention-days: 7
