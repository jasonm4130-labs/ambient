name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which jobs a change needs. `hygiene` always runs (it is cheap and reads the
  # whole tree); the others are skipped when nothing they check has moved, and
  # `gate` treats skipped as passed. On a push to main the comparison is against
  # the commit before the push.
  changes:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      ui: ${{ steps.filter.outputs.ui }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            code:
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - 'make-app.sh'
              - 'setup-signing.sh'
              - 'Ambient.entitlements'
              - 'assets/**'
              - 'ui/**'
              - '.github/workflows/ci.yml'
            ui:
              - 'ui/**'
              - 'assets/settings.html'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - 'docs-site/**'
              - 'README.md'
              - '.github/scripts/**'
              - '.github/workflows/ci.yml'

  # Neither of these compiles the crate, so they run on Linux at $0.004/min.
  # cargo-deny resolves the dependency graph from Cargo.lock without invoking
  # rustc, so the macOS-only dependencies are read rather than built.
  hygiene:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      # The PreToolUse guards the landing loop runs under; see docs/developing/landing.md.
      - run: node --test ".claude/hooks/*.test.mjs"
      - uses: crate-ci/typos@v1.50.0
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check

  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7.0.1
      # `version` is not optional here: it may only be omitted when a
      # `packageManager` field is present, and the repo root has no package.json.
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - run: pnpm run check
        working-directory: ui
      - run: pnpm run lint
        working-directory: ui
      - run: pnpm run build
        working-directory: ui
      # assets/settings.html is committed but generated. This catches a bundle
      # that no longer matches the TypeScript it was built from.
      - run: git diff --exit-code assets/settings.html

  # The crate does not compile anywhere but macOS: process taps, objc2-app-kit
  # and objc2-web-kit have no other target.
  rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      # The pin lives in rust-toolchain.toml so local builds and the work-M5
      # port use it too; the action requires the version as an input, so read it
      # from the file rather than repeating it here.
      - id: pin
        run: |
          echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          components: rustfmt, clippy
      # ort-sys downloads ONNX Runtime to its own cache directory, NOT to
      # $OUT_DIR under target/. Without this line every run re-downloads 80 MB
      # from cdn.pyke.io, warm cache included.
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-directories: ~/Library/Caches/ort.pyke.io
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      # A menu bar icon that does not resolve leaves the previous one showing,
      # so the app would claim to be recording while merely armed. Silent, and
      # only catchable by asking the OS.
      - run: cargo run --bin symbolcheck
      # Assembles the .app. Capture, transcription and diarization cannot be
      # exercised on any hosted runner — no audio device, no way to grant TCC —
      # so CI verifies that the bundle builds, not that it records.
      - run: ./make-app.sh
      - run: |
          codesign -v --verbose=2 build/Ambient.app
          plutil -lint build/Ambient.app/Contents/Info.plist
          test -x build/Ambient.app/Contents/MacOS/ambient

  # The docs site. Its own workflow until 2026-09-04; folded in so that one
  # workflow's conclusion covers every check, which is what the landing loop's
  # merge gate (land.yml) and merge-pr.sh wait on. The paths: filter that kept
  # docs commits off the macOS runner is now the `changes` job below.
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            docs-site/package-lock.json
            .github/scripts/package-lock.json

      # The markdown lives in docs/, not in docs-site/src/content — see
      # docs-site/src/content.config.ts for why and how.
      - run: npm ci
        working-directory: docs-site

      - name: Typecheck
        run: npx astro check
        working-directory: docs-site

      - name: Build
        run: npm run build
        working-directory: docs-site

      # Nimbus's own linter. It is MDX-only and takes no path, so it sees
      # src/content/partials and nothing under docs/ — the markdown is checked
      # by check-links.mjs below instead. Kept because the partial is real
      # content and the frontmatter-shape rule is worth having on it.
      - name: Lint MDX partials
        run: npx nimbus-docs lint
        working-directory: docs-site

      # Nimbus renders `mermaid` as a Shiki *language*, so an untouched fence
      # ships as a code listing. docs-site/src/plugins/mermaid-passthrough.ts
      # rewrites it to <pre class="mermaid"> for the client-side renderer —
      # assert that happened rather than trusting the build's exit code.
      - name: Every mermaid fence reached the renderer
        run: |
          set -euo pipefail
          # --include='*.html' matters: Nimbus emits an .md and an .mdx
          # alternate beside every page, so an unrestricted grep counts each
          # page two or three times and the comparison is meaningless.
          # `|| true` on each grep: with pipefail a no-match exit 1 would kill
          # the step before the counts are printed, turning a clear failure into
          # a silent one.
          fences=$( { grep -rl '^```mermaid' docs/ || true; } | wc -l)
          rendered=$( { grep -rl '<pre class="mermaid">' docs-site/dist/ --include='*.html' || true; } | wc -l)
          echo "pages with a fence: $fences, pages with a rendered block: $rendered"
          if [ "$fences" -ne "$rendered" ]; then
            echo "::error::$fences pages carry a mermaid fence but $rendered reached the renderer"
            exit 1
          fi
          # Deliberately narrower than a bare search for the attribute: the page
          # documenting this guard necessarily quotes it, and a mention inside
          # <code> is prose, not a failure. `[^>]*` cannot cross a `>`, so this
          # matches only the attribute sitting in a real element's opening tag —
          # which is the shape Shiki actually emits.
          if grep -rEq '<(figure|pre)[^>]*data-nb-lang="mermaid"' docs-site/dist/ --include='*.html'; then
            grep -rEln '<(figure|pre)[^>]*data-nb-lang="mermaid"' docs-site/dist/ --include='*.html'
            echo "::error::a mermaid fence shipped as a Shiki code block"
            exit 1
          fi

      # mermaid-passthrough only *moves* a fence; it never parses the diagram,
      # so a syntax error builds cleanly and renders as an error box in the
      # browser. This is the only check here that reads the source rather than
      # the output.
      - run: npm ci
        working-directory: .github/scripts
      - run: node .github/scripts/check-mermaid.mjs

      # The only check that resolves relative links in docs/ and README.md.
      # The Astro build renders a dead link happily, and README.md sits outside
      # every content pipeline in this repo.
      - run: node .github/scripts/check-links.mjs

      # check-links.mjs above checks the SOURCE links, which is what GitHub's
      # file view needs. This checks the BUILT ones, which is a different
      # question: Nimbus passes a relative `foo.md` href straight through to the
      # HTML, where it resolves against the page route and 404s. That shipped
      # once — 111 links across 28 pages — with the build, astro check and every
      # other guard here green, so source-side checking demonstrably does not
      # cover it. Proven both directions: removing rewrite-md-links.ts from
      # astro.config.ts makes this step report exactly those 111 links.
      - name: Every built link resolves to a built route
        run: node .github/scripts/check-routes.mjs

      # A record with no frontmatter is not a page: the content collection
      # rejects it and the build fails, but a record that builds can still be
      # missing from the nav ordering, which makes it hard to find on the site.
      - name: Every ADR is a nav-ordered page
        run: |
          set -euo pipefail
          shopt -s nullglob
          records=(docs/adr/[0-9]*.md)
          # Without nullglob an unmatched glob expands to the literal and the
          # loop below runs zero times, so the guard passes on an empty
          # directory. Assert the count first.
          if [ "${#records[@]}" -lt 12 ]; then
            echo "::error::found ${#records[@]} ADRs under docs/adr/, expected at least 12 — did the directory move?"
            exit 1
          fi
          for f in "${records[@]}"; do
            head -6 "$f" | grep -q '^title:' \
              || { echo "::error::$f has no title in frontmatter"; exit 1; }
            head -6 "$f" | grep -q '^  order:' \
              || { echo "::error::$f has no sidebar.order, so it is unplaced in the nav"; exit 1; }
          done

      # Nothing is deployed yet: workers.dev URLs are public by default and this
      # repo is private, so Cloudflare Access has to be attached first.
      # See docs/developing/docs.md.
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: site
          path: docs-site/dist/
          retention-days: 7

  # The one check to wait on. Every job above either succeeded or was skipped
  # by `changes`; anything else fails here. merge-pr.sh and land.yml read this
  # instead of a per-job list, which is what removes the "a check never
  # registered" failure: a job that does not run is a skip, and a skip passes.
  gate:
    needs: [changes, hygiene, ui, rust, docs]
    if: always()
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - run: |
          set -euo pipefail
          ok=1
          for pair in "changes=${{ needs.changes.result }}" "hygiene=${{ needs.hygiene.result }}" "ui=${{ needs.ui.result }}" "rust=${{ needs.rust.result }}" "docs=${{ needs.docs.result }}"; do
            echo "$pair"
            case "${pair#*=}" in
              success) ;;
              skipped) [ "${pair%=*}" = changes ] && ok=0 ;;
              *) ok=0 ;;
            esac
          done
          [ "$ok" = 1 ] || { echo "::error::a job did not succeed"; exit 1; }
          echo "gate: every job succeeded or was skipped"
