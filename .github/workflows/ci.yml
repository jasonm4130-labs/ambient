name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Fork PRs get GitHub-hosted runners, maintainer branches Blacksmith; also
# require outside-contributor approval in repository settings.
jobs:
  # Jobs skip when nothing they check moved; `gate` treats skipped as passed.
  changes:
    timeout-minutes: 5
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'blacksmith-2vcpu-ubuntu-2404' }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      ui: ${{ steps.filter.outputs.ui }}
      docs: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.docs == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Push path filters need history after checkout removes credentials.
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            code:
              - 'src/**'
              - 'engine/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - 'make-app.sh'
              - 'release.sh'
              - 'fetch-models.sh'
              - 'scripts/**'
              - 'LICENSE'
              - 'THIRD_PARTY_NOTICES.md'
              - 'licenses/**'
              - 'setup-signing.sh'
              - 'Ambient.entitlements'
              - 'assets/**'
              - 'ui/**'
              - '.github/workflows/ci.yml'
            ui:
              - 'ui/**'
              - 'assets/settings.html'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - 'docs-site/**'
              - 'README.md'
              - 'CONTRIBUTING.md'
              - 'SECURITY.md'
              - 'THIRD_PARTY_NOTICES.md'
              - 'LICENSE'
              - 'licenses/**'
              - '.github/scripts/**'
              - '.github/workflows/ci.yml'

  # Linux: cargo-deny reads the graph from Cargo.lock without compiling the
  # macOS-only crate.
  hygiene:
    timeout-minutes: 10
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'blacksmith-2vcpu-ubuntu-2404' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node --test scripts/packaging.test.mjs
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  ui:
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'blacksmith-2vcpu-ubuntu-2404' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `version` is required: the repo root has no package.json `packageManager`.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - run: pnpm run check
        working-directory: ui
      - run: pnpm run lint
        working-directory: ui
      - run: pnpm run test
        working-directory: ui
      - run: pnpm run build
        working-directory: ui
      # assets/settings.html is committed but generated; catch a stale bundle.
      - run: git diff --exit-code assets/settings.html

  # The crate does not compile anywhere but macOS: process taps, objc2-app-kit
  # and objc2-web-kit have no other target.
  rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'macos-15' || 'blacksmith-6vcpu-macos-latest' }}
    timeout-minutes: 30
    env:
      # Outside the runner's home, where the release build must sit; see
      # scripts/build-engine. Fixed so the cache below can name it.
      AMBIENT_ENGINE_BUILD: /tmp/ambient-engine-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The action needs the version as an input; read it from rust-toolchain.toml.
      - id: pin
        run: |
          echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      # An unresolved menu bar icon silently leaves the previous one showing, so the
      # app would claim to be recording while merely armed.
      - run: cargo run --bin symbolcheck
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            engine/.build
            /tmp/ambient-engine-build
          key: engine-${{ runner.os }}-${{ hashFiles('engine/Package.resolved') }}
      - run: scripts/test-engine
      # Hosted runners have no audio device or TCC grant: CI checks that the bundle
      # builds, not that it records.
      - run: ./make-app.sh
      - run: |
          codesign -v --verbose=2 build/Ambient.app
          plutil -lint build/Ambient.app/Contents/Info.plist
          test -x build/Ambient.app/Contents/MacOS/ambient
          test -s build/Ambient.app/Contents/Resources/LICENSE
          test -s build/Ambient.app/Contents/Resources/THIRD_PARTY_NOTICES.md
          ./scripts/check-bundle build/Ambient.app

  docs:
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'blacksmith-2vcpu-ubuntu-2404' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # `version` is required: the repo root has no package.json `packageManager`.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            docs-site/pnpm-lock.yaml
            .github/scripts/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: docs-site

      - name: Typecheck
        run: pnpm exec astro check
        working-directory: docs-site

      - name: Build
        run: pnpm run build
        working-directory: docs-site

      # MDX-only and takes no path, so it lints only src/content/partials;
      # check-links.mjs covers docs/.
      - name: Lint MDX partials
        run: pnpm exec nimbus-docs lint
        working-directory: docs-site

      # Nimbus renders `mermaid` as a Shiki language; assert mermaid-passthrough
      # rewrote every fence rather than trusting the build's exit code.
      - name: Every mermaid fence reached the renderer
        run: |
          set -euo pipefail
          # --include='*.html': Nimbus emits .md and .mdx alternates beside every page.
          # `|| true`: under pipefail a no-match grep would kill the step before the
          # counts print.
          fences=$( { grep -rl '^```mermaid' docs/ || true; } | wc -l)
          rendered=$( { grep -rl '<pre class="mermaid">' docs-site/dist/ --include='*.html' || true; } | wc -l)
          echo "pages with a fence: $fences, pages with a rendered block: $rendered"
          if [ "$fences" -ne "$rendered" ]; then
            echo "::error::$fences pages carry a mermaid fence but $rendered reached the renderer"
            exit 1
          fi
          # `[^>]*` matches only the attribute in a real opening tag, so the docs page
          # quoting this guard inside <code> does not trip it.
          if grep -rEq '<(figure|pre)[^>]*data-nb-lang="mermaid"' docs-site/dist/ --include='*.html'; then
            grep -rEln '<(figure|pre)[^>]*data-nb-lang="mermaid"' docs-site/dist/ --include='*.html'
            echo "::error::a mermaid fence shipped as a Shiki code block"
            exit 1
          fi

      # mermaid-passthrough never parses a diagram, so a syntax error builds cleanly
      # and renders as an error box.
      - run: pnpm install --frozen-lockfile
        working-directory: .github/scripts
      - run: node .github/scripts/check-mermaid.mjs

      # The Astro build renders a dead link happily, and README.md sits outside
      # every content pipeline.
      - run: node .github/scripts/check-links.mjs

      # Built links differ from source links: Nimbus passes a relative `foo.md` href
      # through, and it 404s against the page route. That once shipped 111 broken
      # links with every other guard green.
      - name: Every built link resolves to a built route
        run: node .github/scripts/check-routes.mjs

      # A record that builds can still be missing from the nav ordering.
      - name: Every ADR is a nav-ordered page
        run: |
          set -euo pipefail
          shopt -s nullglob
          records=(docs/adr/[0-9]*.md)
          # Under nullglob an empty directory loops zero times and passes, so assert a
          # count first.
          if [ "${#records[@]}" -lt 12 ]; then
            echo "::error::found ${#records[@]} ADRs under docs/adr/, expected at least 12 — did the directory move?"
            exit 1
          fi
          for f in "${records[@]}"; do
            head -6 "$f" | grep -q '^title:' \
              || { echo "::error::$f has no title in frontmatter"; exit 1; }
            head -6 "$f" | grep -q '^  order:' \
              || { echo "::error::$f has no sidebar.order, so it is unplaced in the nav"; exit 1; }
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: docs-site/dist/
          retention-days: 7

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && !github.event.repository.private
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/dist/

  pages:
    needs: [gate, docs]
    # Path-filtered jobs upstream of gate may skip; evaluate these conditions anyway.
    if: always() && !cancelled() && needs.gate.result == 'success' && needs.docs.result == 'success' && github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy verified documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The one check to wait on (merge-pr.sh reads it): a job `changes` skipped
  # passes, and anything else but success fails.
  gate:
    timeout-minutes: 5
    needs: [changes, hygiene, ui, rust, docs]
    if: always()
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'blacksmith-2vcpu-ubuntu-2404' }}
    steps:
      - run: |
          set -euo pipefail
          ok=1
          for pair in "changes=${{ needs.changes.result }}" "hygiene=${{ needs.hygiene.result }}" "ui=${{ needs.ui.result }}" "rust=${{ needs.rust.result }}" "docs=${{ needs.docs.result }}"; do
            echo "$pair"
            case "${pair#*=}" in
              success) ;;
              skipped) [ "${pair%=*}" = changes ] && ok=0 ;;
              *) ok=0 ;;
            esac
          done
          [ "$ok" = 1 ] || { echo "::error::a job did not succeed"; exit 1; }
          echo "gate: every job succeeded or was skipped"
