[project]
name = "ambient-voice"
version = "0.1.0"
description = "Ambient's out-of-process voice helper: speaks the live assistant's replies with a local TTS model"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["numpy>=2"]

[project.optional-dependencies]
# One extra per engine, so a machine installs only the model runtime it uses.
qwen3-tts = ["mlx-audio==0.5.8"]
supertonic3 = ["supertonic==1.3.1"]
kokoro = ["kokoro-onnx==0.6.1"]
play = ["sounddevice>=0.5"]

[project.scripts]
ambient-voice = "ambient_voice.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
